<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>@0b5vr/experimental - cds.html</title>
    <style>
      #follower {
        position: fixed;
        left: 0;
        top: 0;
        width: 32px;
        height: 32px;
        margin-left: -16px;
        margin-top: -16px;
        background-color: #f00;
        border-radius: 16px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div>Move mouse to set target.</div>
    <div>
      <label>
        factor
        <input id="inputFactor" type="range" min="0" max="4" step="0.01" value="2" />
        <span id="valueFactor"></span>
      </label>
      <br />
      <label>
        ratio
        <input id="inputRatio" type="range" min="0" max="2" step="0.01" value="1" />
        <span id="valueRatio"></span>
      </label>
    </div>
    <div id="follower"></div>

    <script type="module">
      import { CDS } from '../dist/0b5vr-experimental.esm.js';

      // springs
      const springX = new CDS();
      const springY = new CDS();

      // doms
      const follower = document.getElementById('follower');
      const inputFactor = document.getElementById('inputFactor');
      const inputRatio = document.getElementById('inputRatio');
      const valueFactor = document.getElementById('valueFactor');
      const valueRatio = document.getElementById('valueRatio');

      // update
      let lastTime = 0;
      const update = (now) => {
        const deltaTime = (now - lastTime) / 1000;
        lastTime = now;

        const deltaTimeClamped = Math.min(deltaTime, 0.1); // avoid large deltaTime
        const x = springX.update(deltaTimeClamped);
        const y = springY.update(deltaTimeClamped);

        follower.style.transform = `translate(${x}px, ${y}px)`;

        requestAnimationFrame(update);
      };
      requestAnimationFrame(update);

      // mouse move handler
      window.addEventListener('mousemove', (event) => {
        springX.target = event.clientX;
        springY.target = event.clientY;
      });

      // input handlers
      const applyParams = () => {
        const factor = Math.pow(10.0, parseFloat(inputFactor.value));
        const ratio = parseFloat(inputRatio.value);
        springX.factor = factor;
        springY.factor = factor;
        springX.ratio = ratio;
        springY.ratio = ratio;
        valueFactor.textContent = factor.toFixed(1);
        valueRatio.textContent = ratio.toFixed(2);
      };
      applyParams();
      inputFactor.addEventListener('input', applyParams);
      inputRatio.addEventListener('input', applyParams);
    </script>
  </body>
</html>
